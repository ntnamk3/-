<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NemG Shorter URL</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      padding: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 600px;
      animation: fadeIn 1.2s ease;
    }

    .form-control {
      background-color: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
    }

    .form-control::placeholder {
      color: #ddd;
    }

    .form-control:focus {
      background-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .btn-primary {
      background: #ff6a00;
      border: none;
    }

    .btn-primary:hover {
      background: #e65c00;
      transform: scale(1.05);
    }

    #resultLink {
      word-break: break-word;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .spinner-border {
      width: 1.5rem;
      height: 1.5rem;
    }

    #toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1055;
    }
  </style>
</head>
<body>

<div class="glass-card text-center">
  <h2>✨ Rút Gọn Liên Kết Với NemG</h2>
  <p class="mb-4">Dán liên kết của bạn bên dưới và nhấn "Rút Gọn"</p>
  <div class="input-group mb-3">
    <input type="text" class="form-control" id="urlInput" placeholder="https://example.com/">
    <button class="btn btn-primary" id="shortenBtn" onclick="shorturl()">Rút Gọn</button>
  </div>
  <div id="loader" class="my-3" style="display: none;">
    <div class="spinner-border text-light" role="status">
      <span class="visually-hidden">Đang xử lý...</span>
    </div>
  </div>
  <div id="resultContainer" class="mt-4 d-none">
    <h5>🔗 Link rút gọn của bạn:</h5>
    <p id="resultLink" class="lead"></p>
    <button class="btn btn-outline-light" onclick="copyurl()">Sao chép</button>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
  // Toast Notification
  function showToast(message, isSuccess = true) {
    const toastId = 'toast' + Date.now();
    const toastHTML = `
      <div class="toast align-items-center text-bg-${isSuccess ? 'success' : 'danger'} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true" id="${toastId}">
        <div class="d-flex">
          <div class="toast-body">${message}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Đóng"></button>
        </div>
      </div>`;
    document.getElementById('toast-container').insertAdjacentHTML('beforeend', toastHTML);
    const toastEl = document.getElementById(toastId);
    const toast = new bootstrap.Toast(toastEl);
    toast.show();
  }

  async function shorturl() {
    const url = document.getElementById('urlInput').value.trim();
    const loader = document.getElementById('loader');
    const btn = document.getElementById('shortenBtn');
    loader.style.display = 'block';
    btn.disabled = true;

    if (!url || !/^https?:\/\/.+/i.test(url)) {
      loader.style.display = 'none';
      btn.disabled = false;
      showToast("Vui lòng nhập URL hợp lệ!", false);
      return;
    }

    try {
      const res = await fetch("/", {
        method: "POST",
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      });
      const data = await res.json();
      loader.style.display = 'none';
      btn.disabled = false;

      if (data.key && data.status === 200) {
        const fullUrl = window.location.origin + data.key;
        document.getElementById("resultLink").innerText = fullUrl;
        document.getElementById("resultContainer").classList.remove("d-none");
        showToast("🎉 Link đã được rút gọn thành công!");
      } else {
        showToast(data.key || "❌ Đã xảy ra lỗi khi rút gọn.", false);
      }
    } catch (err) {
      loader.style.display = 'none';
      btn.disabled = false;
      showToast("❌ Kết nối thất bại hoặc máy chủ không phản hồi.", false);
    }
  }

  function copyurl() {
    const text = document.getElementById("resultLink").innerText;
    navigator.clipboard.writeText(text).then(() => {
      showToast("✅ Đã sao chép vào clipboard!");
    });
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
